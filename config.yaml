# 服务器配置
Server:
  Address: ":8080"

# 数据库、对象存储与认证密钥仅通过未跟踪环境变量提供：
# POSTGRES_DSN、R2_ENDPOINT、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY、
# R2_BUCKET、R2_PUBLIC_BASE_URL、ADMIN_PASSWORD_HASH（迁移期允许 ADMIN_PASSWORD）和 JWT_SECRET。
# 本文件可以安全地挂载到容器，但不得包含任何凭据。
Auth:
  OwnerUsername: "admin"
  TokenTTLSeconds: 900

# 日志配置
Logger:
  Level: "info"
  JSON: false
  AddSource: false
