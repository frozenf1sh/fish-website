# 服务器配置
Server:
  Address: ":8080"

# 数据库、对象存储与认证密钥仅通过未跟踪环境变量提供：
# POSTGRES_DSN、MINIO_ENDPOINT、MINIO_ACCESS_KEY、MINIO_SECRET_KEY、
# MINIO_BUCKET、ADMIN_PASSWORD_HASH（迁移期允许 ADMIN_PASSWORD）和 JWT_SECRET。
# 本文件可以安全地挂载到容器，但不得包含任何凭据。
Auth:
  OwnerUsername: "admin"
  TokenTTLSeconds: 900

# 日志配置
Logger:
  Level: "info"
  JSON: false
  AddSource: false
