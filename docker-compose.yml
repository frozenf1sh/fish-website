services:
  postgres:
    image: postgres:17-alpine
    container_name: fish-website-postgres
    environment:
      POSTGRES_USER: fish
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fish_website
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fish -d fish_website"]
      interval: 2s
      timeout: 3s
      retries: 10
    networks:
      - fish-network

  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: fish-website-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fishminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - fish-network

  # Local-only S3 emulator setup. Production R2 buckets, custom domains and
  # CORS are platform-managed and are never configured by the application.
  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fishminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      R2_BUCKET: ${R2_BUCKET:-fish-website}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
        mc mb --ignore-existing "local/$$R2_BUCKET"
        mc anonymous set download "local/$$R2_BUCKET"
    networks:
      - fish-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fish-website-backend
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - fish-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fish-website-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - fish-network

volumes:
  postgres-data:
  minio-data:

networks:
  fish-network:
    driver: bridge
