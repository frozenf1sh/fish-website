name: Build, Publish, and Reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: registry.frozenf1sh.top
  IMAGE_PREFIX: registry.frozenf1sh.top/fish-website

jobs:
  docker:
    name: Build ${{ matrix.name }} image
    runs-on: [self-hosted, linux, x64, k3s]
    # Public-repository forks must never execute on the private runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: backend
            context: .
            dockerfile: ./Dockerfile
          - name: frontend
            image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the private registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache-${{ matrix.image }}:buildcache,mode=max

  reconcile:
    name: Commit desired image revision
    needs: docker
    runs-on: [self-hosted, linux, x64, k3s]
    if: github.event_name == 'push'

    steps:
      - name: Update the GitOps image tags
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          perl -0pi -e 's|(newName: registry\.frozenf1sh\.top/fish-website/backend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g; s|(newName: registry\.frozenf1sh\.top/fish-website/frontend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g' deploy/fish-website/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/fish-website/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore(gitops): deploy ${IMAGE_TAG} [skip ci]"
          git push
