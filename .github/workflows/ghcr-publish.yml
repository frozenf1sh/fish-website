name: Build, Publish, and Reconcile

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: registry.frozenf1sh.top
  IMAGE_PREFIX: registry.frozenf1sh.top/fish-website

jobs:
  quality:
    name: Verify contracts and application quality
    runs-on: [self-hosted, linux, x64, k3s]
    # Public-repository forks must never execute on the private runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.3"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.72.0"

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make

      - name: Verify generated API contracts
        run: make generate-check lint

      - name: Test backend
        run: make test

      - name: Install web dependencies reproducibly
        run: npm --prefix frontend ci

      - name: Verify web application
        run: make web-lint web-build

      - name: Validate Kubernetes manifests
        run: make kustomize

  docker:
    name: Build ${{ matrix.name }} image
    needs: quality
    runs-on: [self-hosted, linux, x64, k3s]
    # Public-repository forks must never execute on the private runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: backend
            context: .
            dockerfile: ./Dockerfile
          - name: frontend
            image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # The registry is reachable only through the k3s node's tailnet route.
          # A container-network builder cannot resolve that private DNS name.
          driver-opts: network=host
          # The runner installs this private CA at the referenced host path.
          # setup-buildx copies declared registry certificates into BuildKit.
          buildkitd-config: .github/buildkitd.toml

      - name: Log in to the private registry
        # A manually retried release must run from an immutable v* tag. Branch
        # dispatches retain validation-only behavior and cannot push images.
        if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/cache-${{ matrix.image }}:buildcache,mode=max

  reconcile:
    name: Promote desired image revision
    needs: docker
    runs-on: [self-hosted, linux, x64, k3s]
    # Ordinary pushes update dev; a manual production retry is permitted only
    # from an immutable v* release tag.
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    environment: ${{ github.ref_type == 'tag' && 'production' || 'development' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update the GitOps image tags
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            deploy_branch=production
            deployment_path=deploy/fish-website/kustomization.yaml
            commit_message="部署：提升生产环境至 ${IMAGE_TAG} [skip ci]"
          else
            deploy_branch=main
            deployment_path=deploy/fish-website-dev/kustomization.yaml
            commit_message="部署：更新开发环境至 ${IMAGE_TAG} [skip ci]"
          fi

          # Production desired state is isolated from ordinary main changes.
          git fetch origin "$deploy_branch"
          git checkout -B "$deploy_branch" "origin/$deploy_branch"
          git pull --rebase origin "$deploy_branch"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Promote the production manifest from the exact source revision
            # that built this release image. The production branch is never a
            # delayed copy of main.
            git checkout "$GITHUB_SHA" -- deploy/fish-website
            perl -0pi -e 's|(newName: registry\.frozenf1sh\.top/fish-website/backend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g; s|(newName: registry\.frozenf1sh\.top/fish-website/frontend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g' "$deployment_path"
          else
            perl -0pi -e 's|(name: registry\.frozenf1sh\.top/fish-website/backend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g; s|(name: registry\.frozenf1sh\.top/fish-website/frontend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g' "$deployment_path"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$deployment_path"
          git diff --cached --quiet || git commit -m "$commit_message"
          git push origin "HEAD:$deploy_branch"
