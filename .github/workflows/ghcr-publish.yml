name: Build and Publish

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: fish-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/frozenf1sh/fish-website

jobs:
  quality:
    name: Verify contracts and application quality
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.3"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1
        with:
          version: "1.72.0"

      - name: Verify generated API contracts
        run: |
          buf generate
          git diff --exit-code -- gen frontend/src/gen
          buf lint

      - name: Test backend
        run: go test ./cmd/... ./internal/... ./pkg/... ./db/... ./gen/...

      - name: Install web dependencies reproducibly
        run: npm --prefix frontend ci

      - name: Verify web application
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run build

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Validate Kubernetes manifests
        run: |
          kubectl kustomize deploy/fish-website >/dev/null
          kubectl kustomize deploy/fish-website-dev >/dev/null

  docker:
    name: Build ${{ matrix.name }} image
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: backend
            context: .
            dockerfile: ./Dockerfile
          - name: frontend
            image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  promote-production:
    name: Promote production release
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Promote production to release tag
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          deployment_path=deploy/fish-website/kustomization.yaml
          git fetch origin production
          git checkout -B production origin/production
          git checkout "$GITHUB_SHA" -- deploy/fish-website
          perl -0pi -e 's|(newName: ghcr\.io/frozenf1sh/fish-website/backend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g; s|(newName: ghcr\.io/frozenf1sh/fish-website/frontend\n\s*newTag: )\S+|${1}$ENV{IMAGE_TAG}|g' "$deployment_path"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$deployment_path"
          git diff --cached --quiet || git commit -m "发布：生产环境切换至 ${IMAGE_TAG} [skip ci]"
          git push origin "HEAD:production"
