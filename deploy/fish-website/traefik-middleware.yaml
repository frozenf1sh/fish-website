apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: api-strip
  labels:
    app.kubernetes.io/name: fish-website
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: fish-website
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels:
    app.kubernetes.io/name: fish-website
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: fish-website
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  labels:
    app.kubernetes.io/name: fish-website
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: fish-website
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
