apiVersion: v1
kind: ServiceAccount
metadata:
  name: fish-website
  namespace: fish-website
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: fish-website
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fish-website
  labels: {app.kubernetes.io/name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres}}
    spec:
      serviceAccountName: fish-website
      containers:
        - name: postgres
          image: postgres:17.4-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: fish_website}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: database, key: username}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: database, key: password}}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: fish-website}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrate
  namespace: fish-website
  labels:
    app.kubernetes.io/name: database-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: fish-website
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: fish-website
    spec:
      restartPolicy: OnFailure
      serviceAccountName: fish-website
      automountServiceAccountToken: false
      imagePullSecrets: [{name: registry-credentials}]
      containers:
        - name: database-migrate
          image: backend
          env:
            - {name: POSTGRES_DSN, valueFrom: {secretKeyRef: {name: database, key: dsn}}}
            - {name: R2_ENDPOINT, valueFrom: {secretKeyRef: {name: r2, key: endpoint}}}
            - {name: R2_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: r2, key: access-key-id}}}
            - {name: R2_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: r2, key: secret-access-key}}}
            - {name: R2_BUCKET, valueFrom: {secretKeyRef: {name: r2, key: bucket}}}
            - {name: R2_PUBLIC_BASE_URL, valueFrom: {secretKeyRef: {name: r2, key: public-base-url}}}
            - {name: R2_USE_SSL, value: "true"}
            - {name: CORS_ALLOWED_ORIGINS, value: "https://frozenf1sh.top"}
            - {name: ENABLE_REFLECTION, value: "false"}
            - {name: MIGRATE_ONLY, value: "true"}
            - {name: ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: application, key: admin-password}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: application, key: jwt-secret}}}
            - {name: LOGGER_JSON, value: "true"}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recycle-bin-purge
  namespace: fish-website
  labels:
    app.kubernetes.io/name: recycle-bin-purge
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: fish-website
spec:
  schedule: "0 0 * * *"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recycle-bin-purge
            app.kubernetes.io/component: maintenance
            app.kubernetes.io/part-of: fish-website
        spec:
          restartPolicy: OnFailure
          serviceAccountName: fish-website
          automountServiceAccountToken: false
          imagePullSecrets: [{name: registry-credentials}]
          containers:
            - name: recycle-bin-purge
              image: backend
              command: ["/app/recycle-bin-purge"]
              env:
                - {name: POSTGRES_DSN, valueFrom: {secretKeyRef: {name: database, key: dsn}}}
                - {name: R2_ENDPOINT, valueFrom: {secretKeyRef: {name: r2, key: endpoint}}}
                - {name: R2_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: r2, key: access-key-id}}}
                - {name: R2_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: r2, key: secret-access-key}}}
                - {name: R2_BUCKET, valueFrom: {secretKeyRef: {name: r2, key: bucket}}}
                - {name: R2_PUBLIC_BASE_URL, valueFrom: {secretKeyRef: {name: r2, key: public-base-url}}}
                - {name: R2_USE_SSL, value: "true"}
              resources:
                requests: {cpu: 50m, memory: 96Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities: {drop: [ALL]}
                seccompProfile: {type: RuntimeDefault}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fish-website
  labels: {app.kubernetes.io/name: backend}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: backend}}
  template:
    metadata: {labels: {app.kubernetes.io/name: backend}}
    spec:
      serviceAccountName: fish-website
      imagePullSecrets: [{name: registry-credentials}]
      containers:
        - name: backend
          image: backend
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: POSTGRES_DSN, valueFrom: {secretKeyRef: {name: database, key: dsn}}}
            - {name: R2_ENDPOINT, valueFrom: {secretKeyRef: {name: r2, key: endpoint}}}
            - {name: R2_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: r2, key: access-key-id}}}
            - {name: R2_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: r2, key: secret-access-key}}}
            - {name: R2_BUCKET, valueFrom: {secretKeyRef: {name: r2, key: bucket}}}
            - {name: R2_PUBLIC_BASE_URL, valueFrom: {secretKeyRef: {name: r2, key: public-base-url}}}
            - {name: R2_USE_SSL, value: "true"}
            - {name: CORS_ALLOWED_ORIGINS, value: "https://frozenf1sh.top"}
            - {name: ENABLE_REFLECTION, value: "false"}
            - {name: ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: application, key: admin-password}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: application, key: jwt-secret}}}
            - {name: LOGGER_JSON, value: "true"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /readyz, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 65532, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: fish-website}
spec:
  selector: {app.kubernetes.io/name: backend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fish-website
  labels: {app.kubernetes.io/name: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: frontend}}
  template:
    metadata: {labels: {app.kubernetes.io/name: frontend}}
    spec:
      serviceAccountName: fish-website
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      imagePullSecrets: [{name: registry-credentials}]
      containers:
        - name: frontend
          image: frontend
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: cache, mountPath: /var/cache/nginx}
            - {name: run, mountPath: /var/run}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: cache, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: fish-website}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fish-website
  namespace: fish-website
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: fish-website-api-strip@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [frozenf1sh.top]
      secretName: frozenf1sh-top-tls
  rules:
    - host: frozenf1sh.top
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: backend, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: frontend, port: {name: http}}}
