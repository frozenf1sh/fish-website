apiVersion: apps/v1
kind: Deployment
metadata:
  name: fish-website-runner
  namespace: github-runner
  labels:
    app.kubernetes.io/name: fish-website-runner
    app.kubernetes.io/part-of: fish-website-platform
  annotations:
    description: "Ephemeral self-hosted amd64 runner for the fish-website GitOps pipeline"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fish-website-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fish-website-runner
        app.kubernetes.io/part-of: fish-website-platform
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: summerwind/actions-runner-dind:ubuntu-24.04@sha256:0f5c8e0190bb45850ccfe5336392d632437d621d2194ef393febaaffc9dbdc25
          imagePullPolicy: IfNotPresent
          env:
            - name: RUNNER_REPO
              value: frozenf1sh/fish-website
            - name: RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fish-website-runner-token
                  key: RUNNER_TOKEN
            - name: RUNNER_NAME
              value: tc-k3s-x64-runner-2
            - name: RUNNER_LABELS
              value: self-hosted,linux,x64,k3s
            - name: RUNNER_WORKDIR
              value: /runner/_work
          resources:
            requests:
              cpu: "100m"
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 6Gi
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: runner-work
              mountPath: /runner/_work
            - name: docker-data
              mountPath: /var/lib/docker
          startupProbe:
            exec:
              command: ["sh", "-c", "test -f /runner/.runner"]
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /runner/.runner"]
            periodSeconds: 15
          livenessProbe:
            exec:
              command: ["sh", "-c", "test -d /runner/_work"]
            periodSeconds: 30
      volumes:
        - name: runner-work
          emptyDir: {}
        - name: docker-data
          emptyDir: {}
