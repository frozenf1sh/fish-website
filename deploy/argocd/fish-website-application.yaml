apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fish-website
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: fish-website
  source:
    repoURL: https://github.com/frozenf1sh/fish-website.git
    targetRevision: main
    path: deploy/fish-website
  destination:
    server: https://kubernetes.default.svc
    namespace: fish-website
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
