apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fish-website-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: fish-website
spec:
  description: Minimal platform configuration required by fish-website workloads
  sourceRepos:
    - https://github.com/frozenf1sh/fish-website.git
  destinations:
    - namespace: kube-system
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
