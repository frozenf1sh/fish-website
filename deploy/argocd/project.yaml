apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fish-website
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: fish-website
spec:
  description: fish-website workloads using GHCR
  sourceRepos:
    - https://github.com/frozenf1sh/fish-website.git
  destinations:
    - namespace: fish-website
      server: https://kubernetes.default.svc
    - namespace: fish-website-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
