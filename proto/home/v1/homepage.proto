syntax = "proto3";

package home.v1;

option go_package = "github.com/frozenfish/fish-website/gen/go/home/v1;homev1";

import "google/protobuf/timestamp.proto";

// AuthService handles user authentication
service AuthService {
  // Login authenticates a user with password and returns a token
  rpc Login(LoginRequest) returns (LoginResponse);
  // Refresh exchanges the HttpOnly refresh cookie for a new access token.
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  // Logout clears the refresh cookie for this browser.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

// PostService handles twitter-style timeline posts
service PostService {
  // CreatePost creates a new post with optional images
  rpc CreatePost(CreatePostRequest) returns (CreatePostResponse);
  // ListPosts returns paginated timeline posts
  rpc ListPosts(ListPostsRequest) returns (ListPostsResponse);
  // GetPost returns one post detail by id
  rpc GetPost(GetPostRequest) returns (GetPostResponse);
  // UpdatePost updates post content and image urls
  rpc UpdatePost(UpdatePostRequest) returns (UpdatePostResponse);
  // DeletePost deletes a post by ID
  rpc DeletePost(DeletePostRequest) returns (DeletePostResponse);
}

// BlogService handles blog articles with folder organization
service BlogService {
  // CreateArticle creates a new blog article
  rpc CreateArticle(CreateArticleRequest) returns (CreateArticleResponse);
  // UpdateArticle updates an existing blog article
  rpc UpdateArticle(UpdateArticleRequest) returns (UpdateArticleResponse);
  // DeleteArticle deletes a blog article
  rpc DeleteArticle(DeleteArticleRequest) returns (DeleteArticleResponse);
  // ListArticles returns articles with folder filter support
  rpc ListArticles(ListArticlesRequest) returns (ListArticlesResponse);
  // GetArticle returns a single article by ID
  rpc GetArticle(GetArticleRequest) returns (GetArticleResponse);
  // CreateFolder creates a folder for blog organization
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  // UpdateFolder updates folder name or hierarchy
  rpc UpdateFolder(UpdateFolderRequest) returns (UpdateFolderResponse);
  // DeleteFolder deletes a folder and moves all nested articles to root
  rpc DeleteFolder(DeleteFolderRequest) returns (DeleteFolderResponse);
}

// AlbumService handles photo albums and image uploads
service AlbumService {
  // CreateAlbum creates a new photo album
  rpc CreateAlbum(CreateAlbumRequest) returns (CreateAlbumResponse);
  // ListAlbums lists albums with pagination support
  rpc ListAlbums(ListAlbumsRequest) returns (ListAlbumsResponse);
  // GetAlbum returns one album and its images
  rpc GetAlbum(GetAlbumRequest) returns (GetAlbumResponse);
  // UploadImageRequest gets a presigned URL for uploading an image
  rpc UploadImageRequest(UploadImageRequestRequest) returns (UploadImageRequestResponse);
  // ConfirmImageUpload notifies backend that image has been uploaded
  rpc ConfirmImageUpload(ConfirmImageUploadRequest) returns (ConfirmImageUploadResponse);
  // UpdateAlbum updates album metadata such as name
  rpc UpdateAlbum(UpdateAlbumRequest) returns (UpdateAlbumResponse);
  // MoveImages moves selected images to another album while preserving upload time
  rpc MoveImages(MoveImagesRequest) returns (MoveImagesResponse);
  rpc SetImageDate(SetImageDateRequest) returns (SetImageDateResponse);
  // AnalyzeImageReferences analyzes whether images in an album are still referenced
  rpc AnalyzeImageReferences(AnalyzeImageReferencesRequest) returns (AnalyzeImageReferencesResponse);
  // RepairImageReferences repairs reference counter consistency from source data
  rpc RepairImageReferences(RepairImageReferencesRequest) returns (RepairImageReferencesResponse);
  // DeleteImages deletes images from album and schedules delayed object deletion
  rpc DeleteImages(DeleteImagesRequest) returns (DeleteImagesResponse);
  // DeleteAlbum deletes an album. Deleting recycle bin means permanent deletion.
  rpc DeleteAlbum(DeleteAlbumRequest) returns (DeleteAlbumResponse);
}

// SettingsService handles user settings and preferences
service SettingsService {
  // GetSettings retrieves current user settings
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // UpdateSettings updates user settings
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

// ProjectService manages the public project showcase.
service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc DeleteProject(DeleteProjectRequest) returns (DeleteProjectResponse);
  rpc ReorderProjects(ReorderProjectsRequest) returns (ReorderProjectsResponse);
}

// AboutService manages the public about-page photo collection.
service AboutService {
  rpc GetAbout(GetAboutRequest) returns (GetAboutResponse);
  rpc UpdateAbout(UpdateAboutRequest) returns (UpdateAboutResponse);
  rpc AddAboutImage(AddAboutImageRequest) returns (AddAboutImageResponse);
  rpc RemoveAboutImage(RemoveAboutImageRequest) returns (RemoveAboutImageResponse);
  rpc ReorderAboutImages(ReorderAboutImagesRequest) returns (ReorderAboutImagesResponse);
}

// Auth messages
message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RefreshRequest {}
message RefreshResponse { string token = 1; google.protobuf.Timestamp expires_at = 2; }
message LogoutRequest {}
message LogoutResponse {}

// Post messages
message Post {
  string id = 1;
  string content = 2;
  repeated string image_urls = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CreatePostRequest {
  string content = 1;
  repeated string image_ids = 2;
}

message CreatePostResponse {
  Post post = 1;
}

message ListPostsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListPostsResponse {
  repeated Post posts = 1;
  string next_page_token = 2;
  bool has_more = 3;
}

message GetPostRequest {
  string id = 1;
}

message GetPostResponse {
  Post post = 1;
}

message UpdatePostRequest {
  string id = 1;
  string content = 2;
  repeated string image_urls = 3;
}

message UpdatePostResponse {
  Post post = 1;
}

message DeletePostRequest {
  string id = 1;
}

message DeletePostResponse {}

// Blog messages
message Folder {
  string id = 1;
  string name = 2;
  string parent_folder_id = 3;
  repeated Folder children = 4;
}

enum ArticleStatus {
  ARTICLE_STATUS_UNSPECIFIED = 0;
  ARTICLE_STATUS_DRAFT = 1;
  ARTICLE_STATUS_PUBLISHED = 2;
}

message Article {
  string id = 1;
  string title = 2;
  string content = 3;
  string folder_id = 4;
  repeated string tags = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  ArticleStatus status = 8;
}

message CreateArticleRequest {
  string title = 1;
  string content = 2;
  string folder_id = 3;
  repeated string tags = 4;
  ArticleStatus status = 5;
}

message CreateArticleResponse {
  Article article = 1;
}

message UpdateArticleRequest {
  string article_id = 1;
  string title = 2;
  string content = 3;
  string folder_id = 4;
  repeated string tags = 5;
  ArticleStatus status = 6;
}

message UpdateArticleResponse {
  Article article = 1;
}

message DeleteArticleRequest {
  string article_id = 1;
}

message DeleteArticleResponse {}

message ListArticlesRequest {
  int32 page_size = 1;
  string page_token = 2;
  string folder_id = 3;
  string tag = 4;
  ArticleStatus status = 5;
}

message ListArticlesResponse {
  repeated Article articles = 1;
  string next_page_token = 2;
  bool has_more = 3;
  repeated Folder folders = 4;
}

message GetArticleRequest {
  string article_id = 1;
}

message GetArticleResponse {
  Article article = 1;
}

message CreateFolderRequest {
  string name = 1;
  string parent_folder_id = 2;
}

message CreateFolderResponse {
  Folder folder = 1;
}

message UpdateFolderRequest {
  string folder_id = 1;
  string name = 2;
  string parent_folder_id = 3;
}

message UpdateFolderResponse {
  Folder folder = 1;
}

message DeleteFolderRequest {
  string folder_id = 1;
}

message DeleteFolderResponse {}

// Album messages
message Album {
  string id = 1;
  string name = 2;
  string description = 3;
  bool is_public = 4;
  google.protobuf.Timestamp created_at = 5;
}

message Image {
  string id = 1;
  string album_id = 2;
  string url = 3;
  string thumbnail_url = 4;
  string file_name = 5;
  int64 file_size = 6;
  string mime_type = 7;
  google.protobuf.Timestamp created_at = 8;
  // Optional calendar date assigned by the owner for timeline presentation.
  string photo_date = 9;
}

message CreateAlbumRequest {
  string name = 1;
  string description = 2;
  bool is_public = 3;
}

message CreateAlbumResponse {
  Album album = 1;
}

message ListAlbumsRequest {
  int32 page_size = 1;
  string page_token = 2;
  bool only_public = 3;
}

message ListAlbumsResponse {
  repeated Album albums = 1;
  string next_page_token = 2;
  bool has_more = 3;
}

message GetAlbumRequest {
  string album_id = 1;
}

message GetAlbumResponse {
  Album album = 1;
  repeated Image images = 2;
}

message UploadImageRequestRequest {
  string album_id = 1;
  string file_name = 2;
  string mime_type = 3;
  int64 file_size = 4;
}

message UploadImageRequestResponse {
  string upload_url = 1;
  string image_id = 2;
  map<string, string> headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ConfirmImageUploadRequest {
  string image_id = 1;
  string upload_url = 2;
}

message ConfirmImageUploadResponse {
  Image image = 1;
}

message UpdateAlbumRequest {
  string album_id = 1;
  string name = 2;
  string description = 3;
  bool is_public = 4;
}

message UpdateAlbumResponse {
  Album album = 1;
}

message MoveImagesRequest {
  string from_album_id = 1;
  string target_album_id = 2;
  repeated string image_ids = 3;
}

message MoveImagesResponse {
  int32 moved_count = 1;
}

message SetImageDateRequest {
  string album_id = 1;
  repeated string image_ids = 2;
  // Calendar date in ISO-8601 format: YYYY-MM-DD.
  string photo_date = 3;
}

message SetImageDateResponse {
  int32 updated_count = 1;
}

message ImageReference {
  string image_id = 1;
  string url = 2;
  string file_name = 3;
  int32 reference_count = 4;
  int32 post_reference_count = 5;
  int32 blog_reference_count = 6;
  int32 avatar_reference_count = 7;
  int32 background_reference_count = 8;
  bool safe_to_delete = 9;
  int32 favicon_reference_count = 10;
}

message AnalyzeImageReferencesRequest {
  string album_id = 1;
}

message AnalyzeImageReferencesResponse {
  repeated ImageReference references = 1;
  int32 total_images = 2;
  int32 deletable_images = 3;
  int32 referenced_images = 4;
  int32 total_reference_count = 5;
}

message RepairImageReferencesRequest {}

message RepairImageReferencesResponse {
  int32 processed_images = 1;
  int32 referenced_images = 2;
  int32 total_reference_count = 3;
  google.protobuf.Timestamp repaired_at = 4;
}

message DeleteImagesRequest {
  string album_id = 1;
  repeated string image_ids = 2;
}

message DeleteImagesResponse {
  int32 deleted_count = 1;
  google.protobuf.Timestamp scheduled_delete_at = 2;
}

message DeleteAlbumRequest {
  string album_id = 1;
}

message DeleteAlbumResponse {}

// Settings messages
message GetSettingsRequest {}

message Settings {
  // Personal info
  string display_name = 1;
  string bio = 2;
  string avatar_url = 3;

  // Social links
  string twitter_url = 4;
  string github_url = 5;
  string bilibili_url = 6;
  string custom_links = 7; // JSON string for custom links

  // Visual settings
  string background_image_url = 8;
  bool sakura_particles_enabled = 9;
  string theme_color = 10;

  google.protobuf.Timestamp updated_at = 11;
}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  Settings settings = 1;
  // Field mask for partial updates
  repeated string update_mask = 2;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}

message Project {
  string id = 1;
  string title = 2;
  string summary = 3;
  string link_url = 4;
  Image cover_image = 5;
  int32 sort_order = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListProjectsRequest {}
message ListProjectsResponse { repeated Project projects = 1; }
message GetProjectRequest { string id = 1; }
message GetProjectResponse { Project project = 1; }
message CreateProjectRequest { string title = 1; string summary = 2; string link_url = 3; string cover_image_id = 4; }
message CreateProjectResponse { Project project = 1; }
message UpdateProjectRequest { string id = 1; string title = 2; string summary = 3; string link_url = 4; string cover_image_id = 5; }
message UpdateProjectResponse { Project project = 1; }
message DeleteProjectRequest { string id = 1; }
message DeleteProjectResponse {}
message ReorderProjectsRequest { repeated string project_ids = 1; }
message ReorderProjectsResponse {}

message AboutImage { string id = 1; Image image = 2; int32 sort_order = 3; }
message GetAboutRequest {}
message GetAboutResponse {
  Settings settings = 1;
  repeated AboutImage images = 2;
  string featured_article_id = 3;
}
message UpdateAboutRequest { string featured_article_id = 1; }
message UpdateAboutResponse { string featured_article_id = 1; }
message AddAboutImageRequest { string image_id = 1; }
message AddAboutImageResponse { AboutImage image = 1; }
message RemoveAboutImageRequest { string id = 1; }
message RemoveAboutImageResponse {}
message ReorderAboutImagesRequest { repeated string image_ids = 1; }
message ReorderAboutImagesResponse {}
